name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lofcz/ts-xlsx' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm test
      - name: Build and check package
        run: pnpm run build && pnpm run typecheck:dist && pnpm run smoke:dist && pnpm run size
      - name: Validate OOXML
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run test:ooxml
      - name: Bump package version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version --ignore-scripts
          echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
      - name: Commit release version and create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add package.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ''
        run: npm publish --provenance --access public
      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes
